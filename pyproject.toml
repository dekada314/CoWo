[project]
name = "cowo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "email-validator>=2.3.0",
    "falkordb>=1.8.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "taskiq-aio-pika>=0.6.1",
    "taskiq-fastapi>=0.5.0",
    "taskiq-redis>=1.2.4",
    "types-aiobotocore-s3>=3.9.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["integration: requires COWO_TEST_DATABASE_URL pointing at an empty test database"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["taskiq.TaskiqDepends"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
explicit_package_bases = true
disable_error_code = ["prop-decorator"]
