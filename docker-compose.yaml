services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    networks:
      - cowo_back_network
  postgres:
    image: postgres:18.4
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cowo_back_network

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cowo_back_network

  # minio-init:
  #   image: minio/mc:latest
  #   container_name: kgr-minio-init
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   entrypoint: >
  #     /bin/sh -c "
  #     mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
  #     mc mb --ignore-existing local/${MINIO_BUCKET:-documents} &&
  #     mc anonymous set download local/${MINIO_BUCKET:-documents} &&
  #     exit 0
  #     "
  #   networks:
  #     - cowo_back_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cowo_back_network

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkor
    restart: unless-stopped
    ports:
      - "${FALKORDB_PORT:-6380}:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cowo_back_network
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.0-management
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
      - rabbit_log:/var/log/rabbitmq
      - rabbit_conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: always
    networks:
      - cowo_back_network
  worker:
    build: .
    command: >
      taskiq worker src.infrastructure.taskiq.broker:broker 
      --workers 4
      --fs-discover
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy



volumes:
  postgres_data:
  minio_data:
  redis_data:
  rabbit_data:
  rabbit_log:
  rabbit_conf:
  falkordb_data:

networks:
  cowo_back_network:
    driver: bridge